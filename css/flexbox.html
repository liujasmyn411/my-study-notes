<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>flexbox</title>
  <style>
    .outer{
      width: 1000px;
      height: 900px;
      background-color: #aaa;
      margin: 0 auto;
      /* 将该元素变为了伸缩容器（开启了 flex 布局） ，直接的子元素即 inner 为伸缩元素*/
      display: flex;
      /* display: inline-flex; */
      /* 调整主轴方向，水平从右往左*/
      /* flex-direction: row-reverse; */
      flex-wrap: wrap;
      /* flex-wrap: nowrap; */
      /* flex-wrap: wrap-reverse; */

      /* 主轴对齐方式：主轴起始位置 */
      justify-content: flex-start;
      /* justify-content: flex-end;
      justify-content: center;
      justify-content: space-around;
      justify-content: space-between;
    } */

      /* 侧轴单行对齐方式  想要 stretch 发挥效果，inner 不给高度*/
      align-items: flex-start;
      /* align-items: center;
      align-items: flex-end;
      align-items: baseline;
      align-items: stretch; */

      /* 侧轴多行对齐方式 想要 stretch 发挥效果 inner 不给高度，stretch 默认*/
      align-content: stretch;
      /* align-content: flex-start;
      align-content: flex-end;
      align-content: center;
      align-content: space-around;
      align-content: space-between;
      align-content: space-evenly; */

      /* 伸缩性的伸 按比例伸缩 */
      flex-grow: 1;
      /* 伸缩性的缩 和伸计算不同 */
      flex-shrink: 1;
      /* 基准长度 */
      flex-basis: 100px;
    }

    .inner{
      width: 200px;
      height: 200px;
      background-color: skyblue;
      border: black 1px solid;
      box-sizing: border-box;
      /* float: left; */
    }

    .inner2{
      height: 300px;
    }
    .inner3{
      height: 100px;
    }

  </style>
</head>
<body>
  <div class="outer">
    <div class="inner">1</div>
    <div class="inner inner2">2</div>
    <div class="inner inner3">3</div>
    <div class="inner inner4">4</div>
    <div class="inner inner5">5</div>
    <div class="inner inner">6</div>
    <div class="inner inner">7</div>
    <div class="inner inner">8</div>
    <div class="inner inner">9</div>
    <div class="inner inner">10</div>
    <div class="inner inner">11</div>
    
  </div>
</body>
</html>
